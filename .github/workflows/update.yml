name: Update rule sets

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update rules
        run: |
          chmod +x ./update.sh
          ./update.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 暂存所有修改（包括新创建的文件和删除的文件）
          git add -A
          
          # 检查整个工作区是否有变化
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          
          git commit -m "Update rule sets"
          git push
